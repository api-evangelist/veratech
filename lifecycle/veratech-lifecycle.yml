  note: >-
    No deprecation policy, no Sunset/Deprecation header practice, no end-of-life schedule and
    no supported-versions matrix. NO `Deprecation` pointer is emitted in apis.yml.
  observed_deprecations:
  - item: macOS build of LinkEHR Studio
    evidence: https://linkehr.veratech.es/getlinkehr.html
    detail: >-
      Still advertised on the download page, dated 2016-10-26, with a known issue noted. The
      linked artifact returns HTTP 404 (checked 2026-09-02). This is an undeclared retirement
      — the product was withdrawn without the page being updated, which is exactly the failure
      a deprecation policy prevents.
  - item: Adobe Flash dependency
    evidence: https://linkehr.veratech.es/getlinkehr.html
    detail: >-
      Every platform build still lists "Adobe Flash required to visualize Mindmaps" as a
      requirement. Flash reached end of life on 2020-12-31 and browsers removed it; this
      requirement can no longer be satisfied on a current system, and the page has not been
      revised to say so.
  - item: Java 1.8 runtime requirement
    evidence: https://linkehr.veratech.es/getlinkehr.html
    detail: >-
      Builds require Java 1.8 or higher and target "Windows 7-Windows 10", both of which are
      past their vendor support windows. Recorded as an environment-currency observation.
