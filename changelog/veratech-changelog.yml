- version: 1.0.20221031
  date: '2022-10-31'
  breaking: false
  additions:
  - OPT mapping cleanup now converts mandatory-occurrence alternatives into optional ones, enabling element cloning in mapping
  - Updated openEHR RM archetypes to the latest available openEHR XSD
  fixes:
  - External XML/JSON calls in mapping now propagate exceptions to the XQuery library instead of swallowing them
  - Template visualization and XPath now use the archetype id instead of the atcode for solved slots
  highlights: FHIR profile generation moved under a dedicated FHIR menu.
- version: 1.0.20220923
  date: '2022-09-23'
  breaking: false
  additions:
  - Standard-specific default mappings (archetype_id, name, archetype_details, encoding, language) applied context-sensitively
  - Full template support in mapping — mapping paths may now contain archetype ids
  highlights: >-
    The largest functional entry in the recent window; makes template-level mapping viable
