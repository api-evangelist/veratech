- version: 1.0.20240603
  date: '2024-06-03'
  breaking: false
  additions:
  - Alternate expansion of C_DV_QUANTITY as unit alternatives rather than DV_QUANTITY alternatives
  - Icons added to domain types
  - Button for single-patient XQuery generation
  fixes:
  - ADL export after OPT import fixed for potential missing labels in the source OPT
  - term_mapping definition in the openEHR editor made consistent with the "any allowed" button
