- version: 1.0.20221128
  date: '2022-11-28'
  breaking: false
  additions:
  - Updated openEHR RM to define null_flavour as optional
  fixes:
  - Ontological mapping functions failing to find the archetype ontology
  - openEHR editor producing erroneous ADL for unconstrained DV_QUANTITY / DV_PARSABLE
  - Default DV_TIME pattern corrected to "hh:??:??"
