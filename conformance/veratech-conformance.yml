- id: hl7-fhir
  name: HL7 FHIR
  conforms: partial
  basis: product-implementation
  contract_verified: false
  evidence:
  - url: https://openehr2fhir.veratech.es/
    detail: >-
      A live public web application titled "Transform to FHIR Observation" that converts
      openEHR content into FHIR Observation resources. HTTP 200, checked 2026-09-02. It is a
      browser UI only — no documented programmatic endpoint, no OpenAPI, no CapabilityStatement.
  - url: https://linkehr.veratech.es/data/Whatsnew.txt
    detail: >-
      Repeated FHIR work across releases — openEHR2FHIR Questionnaire generation, FHIR logical
      model generation from templates, and a dedicated FHIR profile-generation menu.
  gap: >-
    No FHIR CapabilityStatement and no FHIR server is published. Conformance is "partial"
    because Veratech PRODUCES FHIR artifacts with its tooling rather than SERVING a conformant
    FHIR endpoint. A FHIR conformance check that looks for /metadata will correctly find nothing.
