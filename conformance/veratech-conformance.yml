reading_note: >-
  READ THE basis FIELD BEFORE THE conforms FIELD. Veratech publishes no machine-readable API
  contract of any kind (see x-coverage in apis.yml), so NOTHING in this file was verified the
  way this pipeline normally verifies conformance — by reading a spec. Every entry below is
  `basis: product-implementation`: the standard is implemented by shipped software and
  evidenced by the provider's own product documentation and dated changelog, not by an
  OpenAPI/AsyncAPI/WSDL document declaring it. `contract_verified` is false on every row and
  that is the finding, not an oversight.
domain_standard_conformance:
  awarded: false
  reason: >-
    The 0.12.0 domain_standard_conformance check reads a CONTRACT declaring its market's
    standard — a SCIM schema URN, an OData $metadata surface, an HL7v2/FHIR message type in a
    spec, and so on. Veratech is deep in health-data standards and would be a natural
    candidate, but it ships no contract in which such a declaration could appear, so the
    check cannot fire. This is a reward-only check and its absence is not a penalty; it is
    recorded here so a later pass does not re-litigate it. If Veratech ever publishes an
    OpenAPI for the openEHR-to-FHIR transformation service, this becomes awardable
    immediately.
  regime: health
