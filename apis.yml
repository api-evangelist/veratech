aid: veratech
name: Veratech for Health
description: >-
  VeraTech for Health S.L. is a Spanish semantic-interoperability consultancy and health-data
  tooling vendor, founded in 2010 in Valencia as a spin-off of the Biomedical Informatics group
  (IBIME) at the Universitat Politecnica de Valencia and based at BIOHUB VLC. It helps hospitals,
  regional health services and research networks make clinical data comprehensible and reusable,
  combining advisory work, an interoperability office model and applied innovation (NLP, knowledge
  graphs, machine learning) with its own LinkEHR Interoperability Platform. LinkEHR is a set of
  desktop and server tools for authoring clinical information models as archetypes and normalizing
  legacy clinical data into openEHR, ISO/EN 13606, HL7 CDA, HL7 FHIR, OMOP CDM and CDISC ODM.
  Veratech is an official openEHR training provider for CatSalut, is EHDEN-accredited for OMOP CDM
  mapping, and works on SNOMED CT adoption in the Spanish national health system. It publishes no
  public developer program, no API and no machine-readable contract; its software is distributed
  as downloadable builds and commercially licensed modules sold through direct contact.
